[package]
name = "competition-escrow"
version = "0.1.0"
edition = "2021"

[dependencies]
pinocchio = { version = "0.11.1", features = ["cpi", "copy"] }
pinocchio-system = "0.6.1"
pinocchio-token = "0.6.0"
pinocchio-associated-token-account = "0.4.0"

# Host tests need the CPU PDA implementation; SBF uses the runtime syscall.
[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { version = "2.9.0", features = ["curve25519"] }

[lib]
crate-type = ["cdylib", "lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
